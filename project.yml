name: Brain
options:
  bundleIdPrefix: io.mindkeeper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: XCHXTX3N92
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  Brain:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Brain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mindkeeper.brain
        PRODUCT_NAME: brain
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: brain
        # Export compliance: declare we only use exempt encryption
        # (HTTPS), so App Store Connect won't prompt on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        # M41: APNs entitlement file. `Brain.entitlements` lives at
        # the repo root and contains `aps-environment: development`,
        # which is correct for Simulator + dev-signed device builds.
        # Xcode rewrites it to `production` automatically when
        # archiving for TestFlight / App Store distribution.
        CODE_SIGN_ENTITLEMENTS: Brain.entitlements

  # M45 Wave 1: first XCTest target for brain-ios. Hosts the new
  # Repository + MutationStatusStore unit tests under
  # `Tests/BrainTests/`. Linked against the `Brain` app target via
  # `dependencies` + `TEST_HOST` so `@testable import brain` reaches
  # the internal types (NoteRepository, MutationStatusStore, etc.).
  BrainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/BrainTests
    dependencies:
      - target: Brain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mindkeeper.brain.tests
        GENERATE_INFOPLIST_FILE: YES
        # Standard host pattern for an iOS app's XCTest bundle —
        # injects the unit-test bundle into the Brain.app process so
        # `@testable import brain` resolves and SwiftData /
        # ModelContainer behave the same way they do in production.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/brain.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/brain
        BUNDLE_LOADER: $(TEST_HOST)

  # Tier 2 e2e harness: XCUITest target. Drives the running Brain.app
  # via `XCUIApplication` with `-uiTesting` injected, which swaps in
  # `FakeBrainURLProtocol` for the URL session and bootstraps a
  # signed-in `AuthSession` so tests start from the SignedInRootView
  # without touching real credentials. Distinct from `BrainTests`:
  # UI tests run in a separate runner process and only see the app's
  # public surface through accessibility identifiers.
  BrainUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/BrainUITests
    dependencies:
      - target: Brain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mindkeeper.brain.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Brain

# OS_ACTIVITY_MODE=disable silences the unified-logging spam from
# CFNetwork, libsystem_*, CoreData, hapticpatternlibrary, RTI, etc.
# in the Xcode debug console. The brain app's own NSLog/print calls
# still appear. Remove or set to "default" if debugging anything that
# relies on system-subsystem logs (e.g. networking issues, Keychain
# diagnostics — see the M37 destructive-fallback path).
schemes:
  Brain:
    build:
      targets:
        Brain: all
        BrainTests: [test]
        BrainUITests: [test]
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    # M45 Wave 1: test action runs the BrainTests bundle. Invoked via
    # `xcodebuild test -project Brain.xcodeproj -scheme Brain ...` so
    # the Brain scheme is the single entry point for both build + test.
    test:
      config: Debug
      targets:
        - BrainTests
        - BrainUITests
