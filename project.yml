name: Brain
options:
  bundleIdPrefix: io.mindkeeper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Brain:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Brain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.mindkeeper.brain
        PRODUCT_NAME: brain
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: brain
        # M41: enable silent-push wake. APNs payloads with
        # `content-available: 1` deliver to
        # `application(_:didReceiveRemoteNotification:fetchCompletionHandler:)`
        # while the app is backgrounded. The system grants ~30s per
        # wake; we use it to drain SyncEngine and the mutation queue.
        # Space-separated values are recognised by `INFOPLIST_KEY_*` as
        # an array, matching how `UISupportedInterfaceOrientations` is
        # already declared above.
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        GENERATE_INFOPLIST_FILE: YES
        # M41: APNs entitlement file. `Brain.entitlements` lives at
        # the repo root and contains `aps-environment: development`,
        # which is correct for Simulator + dev-signed device builds.
        # Xcode rewrites it to `production` automatically when
        # archiving for TestFlight / App Store distribution.
        CODE_SIGN_ENTITLEMENTS: Brain.entitlements

# OS_ACTIVITY_MODE=disable silences the unified-logging spam from
# CFNetwork, libsystem_*, CoreData, hapticpatternlibrary, RTI, etc.
# in the Xcode debug console. The brain app's own NSLog/print calls
# still appear. Remove or set to "default" if debugging anything that
# relies on system-subsystem logs (e.g. networking issues, Keychain
# diagnostics — see the M37 destructive-fallback path).
schemes:
  Brain:
    build:
      targets:
        Brain: all
    run:
      config: Debug
      environmentVariables:
        OS_ACTIVITY_MODE: disable
